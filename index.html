
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Checklist</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 35px auto;
      padding: 25px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: #5865f2;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.88;
    }

    .progress {
      display: flex;
      justify-content: space-between;
      color: #666;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .progress-track {
      height: 7px;
      background: #e9eaf0;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #5865f2;
      transition: width 0.2s;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 10px;
      border-bottom: 1px solid #eee;
      overflow-wrap: anywhere;
    }

    li input[type="checkbox"] {
      width: 19px;
      height: 19px;
      flex-shrink: 0;
      cursor: pointer;
      accent-color: #5865f2;
    }

    .task-text {
      flex: 1;
      line-height: 1.4;
    }

    li.done .task-text {
      text-decoration: line-through;
      color: #999;
    }

    .delete {
      background: #ffe8e8;
      color: #c62828;
      padding: 8px 10px;
      flex-shrink: 0;
    }

    .empty {
      text-align: center;
      color: #999;
      padding: 28px 0;
    }

    .footer {
      margin-top: 22px;
      text-align: center;
      color: #999;
      font-size: 12px;
    }

    @media (max-width: 420px) {
      .container {
        padding: 18px;
        margin: 10px auto;
      }

      .input-row button {
        padding: 12px;
      }

      li {
        gap: 8px;
        padding: 12px 4px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>My Checklist ✅</h1>
    <p class="subtitle">Your tasks, your progress.</p>

    <form class="input-row" id="taskForm">
      <input
        type="text"
        id="taskInput"
        placeholder="Add a new task..."
        maxlength="200"
        autocomplete="off"
        required
      >
      <button type="submit">Add +</button>
    </form>

    <div class="progress">
      <span>My progress</span>
      <span id="progressText">0 / 0 completed</span>
    </div>

    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <ul id="taskList"></ul>

    <div class="footer">
      Saved on this device · Free forever on GitHub Pages
    </div>
  </main>

  <script>
    const STORAGE_KEY = "my-checklist-tasks-v1";

    let tasks = [];

    // Start with a completely blank checklist on first use.
    // Existing saved tasks on this browser are preserved.
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed)) tasks = parsed;
      }
    } catch (error) {
      tasks = [];
    }

    const taskForm = document.getElementById("taskForm");
    const taskInput = document.getElementById("taskInput");
    const taskList = document.getElementById("taskList");
    const progressText = document.getElementById("progressText");
    const progressFill = document.getElementById("progressFill");

    function saveTasks() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      } catch (error) {
        console.warn("Tasks could not be saved on this device.");
      }
    }

    function renderTasks() {
      taskList.replaceChildren();

      if (tasks.length === 0) {
        const empty = document.createElement("li");
        empty.className = "empty";
        empty.textContent = "Your checklist is empty. Add your first task!";
        taskList.appendChild(empty);
      }

      tasks.forEach((task, index) => {
        const li = document.createElement("li");
        if (task.done) li.classList.add("done");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = Boolean(task.done);
        checkbox.setAttribute("aria-label", "Complete " + task.text);

        checkbox.addEventListener("change", () => {
          tasks[index].done = checkbox.checked;
          saveTasks();
          renderTasks();
        });

        const text = document.createElement("span");
        text.className = "task-text";
        text.textContent = task.text;

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete";
        deleteButton.type = "button";
        deleteButton.textContent = "Delete";
        deleteButton.setAttribute("aria-label", "Delete " + task.text);

        deleteButton.addEventListener("click", () => {
          tasks.splice(index, 1);
          saveTasks();
          renderTasks();
        });

        li.append(checkbox, text, deleteButton);
        taskList.appendChild(li);
      });

      const completed = tasks.filter(task => task.done).length;
      const total = tasks.length;

      progressText.textContent = `${completed} / ${total} completed`;
      progressFill.style.width =
        (total === 0 ? 0 : completed / total * 100) + "%";
    }

    taskForm.addEventListener("submit", event => {
      event.preventDefault();

      const text = taskInput.value.trim();
      if (!text) return;

      tasks.push({
        text: text,
        done: false
      });

      saveTasks();
      renderTasks();

      taskInput.value = "";
      taskInput.focus();
    });

    renderTasks();
  </script>
</body>
</html>
