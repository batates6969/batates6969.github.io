
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCU No-Scroll Tracker</title>

    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --mcu-red: #e23636;
            --mcu-blue: #2f80ed;
            --accent-green: #2ea44f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 10px 15px;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 8px;
        }

        h1 {
            color: #fff;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        h1 span {
            color: var(--mcu-red);
        }

        .dashboard {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            width: 100%;
            max-width: 800px;
            margin: 0 auto 10px;
            padding: 8px 15px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            align-items: center;
            text-align: center;
        }

        .stat-box h3 {
            font-size: 1.2rem;
            color: #fff;
        }

        .stat-box p {
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        .progress-container {
            grid-column: span 3;
            background-color: var(--border-color);
            border-radius: 4px;
            height: 6px;
            overflow: hidden;
            margin-top: 2px;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--accent-green);
            width: 0%;
            transition: width 0.3s ease;
        }

        .saga-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            flex: 1;
            min-height: 0;
            margin-bottom: 5px;
        }

        .saga-column {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .saga-title {
            font-size: 1.1rem;
            color: #fff;
            margin-bottom: 8px;
            padding-bottom: 4px;
            border-bottom: 2px solid var(--border-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .infinity-title {
            border-color: var(--mcu-red);
            color: #ff6b6b;
        }

        .multiverse-title {
            border-color: var(--mcu-blue);
            color: #54a0ff;
        }

        .item-list-wrapper {
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
        }

        .item-list-wrapper::-webkit-scrollbar {
            width: 6px;
        }

        .item-list-wrapper::-webkit-scrollbar-thumb {
            background-color: var(--border-color);
            border-radius: 3px;
        }

        .item-list {
            list-style: none;
            display: grid;
            grid-template-columns: 1fr;
            gap: 5px;
        }

        @media (min-width: 1200px) {
            .item-list {
                grid-template-columns: 1fr 1fr;
                gap: 6px;
            }
        }

        .checklist-item {
            display: flex;
            align-items: center;
            padding: 6px 10px;
            background-color: rgba(255, 255, 255, 0.01);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.15s;
            font-size: 0.85rem;
            user-select: none;
            min-width: 0;
        }

        .checklist-item:hover {
            background-color: rgba(255, 255, 255, 0.04);
            border-color: #8b949e;
        }

        .checklist-item.checked {
            background-color: rgba(46, 164, 79, 0.08);
            border-color: var(--accent-green);
        }

        .checklist-item input[type="checkbox"] {
            margin-right: 10px;
            width: 14px;
            height: 14px;
            flex-shrink: 0;
            accent-color: var(--accent-green);
            cursor: pointer;
        }

        .item-details {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            min-width: 0;
            gap: 10px;
        }

        .item-title {
            font-weight: 500;
            color: #f0f6fc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
        }

        .checklist-item.checked .item-title {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .item-meta {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .item-year {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .badge {
            padding: 1px 4px;
            border-radius: 3px;
            font-size: 0.65rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .badge-movie {
            background-color: #4a154b;
            color: #fff;
        }

        .badge-series {
            background-color: #005a9c;
            color: #fff;
        }

        @media (max-width: 650px) {
            body {
                padding: 8px;
            }

            h1 {
                font-size: 1.15rem;
            }

            .saga-container {
                gap: 8px;
            }

            .saga-column {
                padding: 7px;
            }

            .saga-title {
                font-size: 0.85rem;
            }

            .checklist-item {
                padding: 6px 5px;
                font-size: 0.75rem;
            }

            .checklist-item input[type="checkbox"] {
                margin-right: 5px;
            }

            .item-details {
                gap: 4px;
            }

            .item-meta {
                gap: 3px;
            }

            .item-year {
                font-size: 0.65rem;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1><span>MCU</span> Chronological Tracker</h1>
    </header>

    <div class="dashboard">
        <div class="stat-box">
            <h3 id="completed-count">0</h3>
            <p>Completed</p>
        </div>

        <div class="stat-box">
            <h3 id="total-count">0</h3>
            <p>Total Items</p>
        </div>

        <div class="stat-box">
            <h3 id="percent-complete">0%</h3>
            <p>Progress</p>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
    </div>

    <div class="saga-container">

        <div class="saga-column">
            <h2 class="saga-title infinity-title">The Infinity Saga</h2>
            <div class="item-list-wrapper">
                <ul class="item-list" id="infinity-list"></ul>
            </div>
        </div>

        <div class="saga-column">
            <h2 class="saga-title multiverse-title">The Multiverse Saga</h2>
            <div class="item-list-wrapper">
                <ul class="item-list" id="multiverse-list"></ul>
            </div>
        </div>

    </div>

    <script>
        const mcuData = [

            // INFINITY SAGA

            { title: "Captain America: The First Avenger", year: 2011, type: "movie", saga: "infinity", checked: false },
            { title: "The Fantastic Four: First Steps", year: 2025, type: "movie", saga: "infinity", checked: false },
            { title: "Captain Marvel", year: 2019, type: "movie", saga: "infinity", checked: false },
            { title: "Iron Man", year: 2008, type: "movie", saga: "infinity", checked: false },
            { title: "Iron Man 2", year: 2010, type: "movie", saga: "infinity", checked: false },
            { title: "The Incredible Hulk", year: 2008, type: "movie", saga: "infinity", checked: false },
            { title: "Thor", year: 2011, type: "movie", saga: "infinity", checked: false },
            { title: "The Avengers", year: 2012, type: "movie", saga: "infinity", checked: true },
            { title: "Thor: The Dark World", year: 2013, type: "movie", saga: "infinity", checked: false },
            { title: "Iron Man 3", year: 2013, type: "movie", saga: "infinity", checked: false },
            { title: "Captain America: The Winter Soldier", year: 2014, type: "movie", saga: "infinity", checked: false },
            { title: "Guardians of the Galaxy", year: 2014, type: "movie", saga: "infinity", checked: false },
            { title: "Guardians of the Galaxy Vol. 2", year: 2017, type: "movie", saga: "infinity", checked: false },
            { title: "I Am Groot", year: "22-23", type: "series", saga: "infinity", checked: false },
            { title: "Avengers: Age of Ultron", year: 2015, type: "movie", saga: "infinity", checked: true },
            { title: "Ant-Man", year: 2015, type: "movie", saga: "infinity", checked: false },
            { title: "Captain America: Civil War", year: 2016, type: "movie", saga: "infinity", checked: true },
            { title: "Black Widow", year: 2021, type: "movie", saga: "infinity", checked: false },
            { title: "Black Panther", year: 2018, type: "movie", saga: "infinity", checked: false },
            { title: "Spider-Man: Homecoming", year: 2017, type: "movie", saga: "infinity", checked: true },
            { title: "Doctor Strange", year: 2016, type: "movie", saga: "infinity", checked: false },
            { title: "Thor: Ragnarok", year: 2017, type: "movie", saga: "infinity", checked: false },
            { title: "Ant-Man and the Wasp", year: 2018, type: "movie", saga: "infinity", checked: false },
            { title: "Avengers: Infinity War", year: 2018, type: "movie", saga: "infinity", checked: true },
            { title: "Avengers: Endgame", year: 2019, type: "movie", saga: "infinity", checked: true },

            // MULTIVERSE SAGA

            { title: "Loki", year: "21-23", type: "series", saga: "multiverse", checked: false },
            { title: "Spider-Man: Far From Home", year: 2019, type: "movie", saga: "multiverse", checked: true },
            { title: "Spider-Man: No Way Home", year: 2021, type: "movie", saga: "multiverse", checked: true },
            { title: "What If...?", year: "21-24", type: "series", saga: "multiverse", checked: true },
            { title: "WandaVision", year: 2021, type: "series", saga: "multiverse", checked: false },
            { title: "Shang-Chi and the Legend of the Ten Rings", year: 2021, type: "movie", saga: "multiverse", checked: true },
            { title: "The Falcon and the Winter Soldier", year: 2021, type: "series", saga: "multiverse", checked: false },
            { title: "Eternals", year: 2021, type: "movie", saga: "multiverse", checked: false },
            { title: "Doctor Strange in the Multiverse of Madness", year: 2022, type: "movie", saga: "multiverse", checked: false },
            { title: "Hawkeye", year: 2021, type: "series", saga: "multiverse", checked: false },
            { title: "Moon Knight", year: 2022, type: "series", saga: "multiverse", checked: false },
            { title: "Black Panther: Wakanda Forever", year: 2022, type: "movie", saga: "multiverse", checked: false },
            { title: "She-Hulk: Attorney at Law", year: 2022, type: "series", saga: "multiverse", checked: false },
            { title: "Ms. Marvel", year: 2022, type: "series", saga: "multiverse", checked: false },
            { title: "Thor: Love and Thunder", year: 2022, type: "movie", saga: "multiverse", checked: false },
            { title: "Ironheart", year: 2025, type: "series", saga: "multiverse", checked: false },
            { title: "Werewolf by Night", year: 2022, type: "movie", saga: "multiverse", checked: false },
            { title: "The Guardians of the Galaxy Holiday Special", year: 2022, type: "movie", saga: "multiverse", checked: false },
            { title: "Ant-Man and the Wasp: Quantumania", year: 2023, type: "movie", saga: "multiverse", checked: false },
            { title: "Guardians of the Galaxy Vol. 3", year: 2023, type: "movie", saga: "multiverse", checked: false },
            { title: "Secret Invasion", year: 2023, type: "series", saga: "multiverse", checked: false },
            { title: "The Marvels", year: 2023, type: "movie", saga: "multiverse", checked: false },
            { title: "Deadpool and Wolverine", year: 2024, type: "movie", saga: "multiverse", checked: false },
            { title: "Agatha All Along", year: 2024, type: "series", saga: "multiverse", checked: false },
            { title: "Captain America: Brave New World", year: 2025, type: "movie", saga: "multiverse", checked: false },
            { title: "Thunderbolts*", year: 2025, type: "movie", saga: "multiverse", checked: false },
            { title: "Spider-Man: Brand New Day", year: 2026, type: "movie", saga: "multiverse", checked: true }

        ];

        const infinityList = document.getElementById("infinity-list");
        const multiverseList = document.getElementById("multiverse-list");

        function updateDashboard() {
            const total = mcuData.length;
            const completed = mcuData.filter(item => item.checked).length;
            const percentage = total > 0
                ? Math.round((completed / total) * 100)
                : 0;

            document.getElementById("completed-count").textContent = completed;
            document.getElementById("total-count").textContent = total;
            document.getElementById("percent-complete").textContent = `${percentage}%`;
            document.getElementById("progress-bar").style.width = `${percentage}%`;
        }

        function buildLists() {
            infinityList.innerHTML = "";
            multiverseList.innerHTML = "";

            mcuData.forEach((item, index) => {
                const li = document.createElement("li");
                li.className = `checklist-item ${item.checked ? "checked" : ""}`;

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.id = `item-${index}`;
                checkbox.checked = item.checked;

                const details = document.createElement("div");
                details.className = "item-details";

                const title = document.createElement("span");
                title.className = "item-title";
                title.textContent = item.title;
                title.title = item.title;

                const meta = document.createElement("div");
                meta.className = "item-meta";

                const badge = document.createElement("span");
                badge.className = `badge ${item.type === "movie" ? "badge-movie" : "badge-series"}`;
                badge.textContent = item.type;

                const year = document.createElement("span");
                year.className = "item-year";
                year.textContent = typeof item.year === "number"
                    ? `'${String(item.year).slice(-2)}`
                    : item.year;

                meta.appendChild(badge);
                meta.appendChild(year);

                details.appendChild(title);
                details.appendChild(meta);

                li.appendChild(checkbox);
                li.appendChild(details);

                function toggleItem() {
                    item.checked = checkbox.checked;
                    li.classList.toggle("checked", item.checked);
                    updateDashboard();
                }

                checkbox.addEventListener("change", toggleItem);

                li.addEventListener("click", (event) => {
                    if (event.target !== checkbox) {
                        checkbox.checked = !checkbox.checked;
                        toggleItem();
                    }
                });

                if (item.saga === "infinity") {
                    infinityList.appendChild(li);
                } else {
                    multiverseList.appendChild(li);
                }
            });
        }

        buildLists();
        updateDashboard();
    </script>

</body>
</html>
